<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amazon.com</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css" integrity="sha512-ApSLB1Pd3/bZN8fWB/RG9YhN/7bd9Hkf3AGaE2mPfebjrxagjuBtx2GcgdqIlJkUzwylBo61r9Xa9NmgBI0swA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="style.css" /> 
</head>
<body>
    <header>
        <div class="navbar">

            <div class="nav-logo border">
                <div class="logo"></div>
            </div>

            <div class="nav-add border">
                <p class="add-first">Deliver to</p>
                <div class="add-icon">
                    <i class="fa-solid fa-location-dot"></i>
                    <p class="add-second">India</p>
                </div>
            </div>

            <div class="nav-search">
                <select class="search-select">
                    <option hidden>All</option>
                    <option>All Departments</option>
                    <option>Arts & Crafts</option>
                    <option>Automotive</option>
                    <option>Baby</option>
                    <option>Cosmetics</option>
                    <option>Books</option>
                    <option>Computers</option>
                    <option>Deals</option>
                    <option>Electronics</option>
                    <option>Luggage</option>
                </select>
                <input class="search-input" placeholder="Search Amazon" />
                <div class="search-icon">
                    <i class="fa-solid fa-magnifying-glass"></i>
                </div>
            </div>

            <div class="nav-lang border">
                <div class="lang-icon">
                    <i class="fa-solid fa-language"></i>
                </div>
                <select class="lang-select">
                    <option hidden>EN</option>
                    <option>English</option>
                    <option>Hindi</option>
                    <option>Tamil</option>
                    <option>Bhojpuri</option>
                    <option>Gujrati</option>
                    <option>Malyalam</option>
                    <option>Telgu</option>
                    <option>Assami</option>
                    <option>Urdu</option>
                </select>
            </div>

            <div class="nav-signin border">
                <p class="nav-first"><span>Hello, sign-in</span></p>
                <p class="nav-second">Account & Lists</p>
            </div>

            <div class="nav-orders border">
                <p class="nav-first"><span>Returns</span></p>
                <p class="nav-second">& Orders</p>
            </div>

            <div class="nav-cart border">
                <div class="cart-icon">
                    <i class="fa-solid fa-cart-shopping"></i>
                </div>
                <p class="nav-second">Cart</p>
            </div>
            
        </div>
        <div class="panel">
            <div class="panel-all">
                <div class="all-icon">
                    <i class="fa-solid fa-bars"></i>
                </div>
                <p>All</p>
            </div>
            <div class="panel-ops">
                <p>Today's Deals</p>
                <p>Prime Video</p>
                <p>Service</p>
                <p>Gift Cards</p>
                <p>Sell</p>
                <p>Registry</p>
            </div>
            <div class="panel-deals">
                <p>Shop deals in Electronics</p>
            </div>
        </div>
    </header>
</body>
</html>
